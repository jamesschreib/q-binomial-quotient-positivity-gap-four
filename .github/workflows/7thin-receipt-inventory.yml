name: Temporary 7-thin receipt inventory probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe receipt inventory without exporting credentials
        shell: bash
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          STORAGE_CONNECTION_STRING: ${{ secrets.STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          STORAGE_ACCOUNT_KEY: ${{ secrets.STORAGE_ACCOUNT_KEY }}
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
          AZURE_SAS_TOKEN: ${{ secrets.AZURE_SAS_TOKEN }}
          SAT_RUNS_SAS: ${{ secrets.SAT_RUNS_SAS }}
          SAT_RUNS_SAS_TOKEN: ${{ secrets.SAT_RUNS_SAS_TOKEN }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          mkdir -p probe

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          names = [
              "AZURE_STORAGE_CONNECTION_STRING", "STORAGE_CONNECTION_STRING",
              "AZURE_STORAGE_ACCOUNT_KEY", "AZURE_STORAGE_KEY", "STORAGE_ACCOUNT_KEY",
              "AZURE_STORAGE_SAS_TOKEN", "AZURE_SAS_TOKEN", "SAT_RUNS_SAS",
              "SAT_RUNS_SAS_TOKEN", "AZURE_CREDENTIALS",
          ]
          present = {name: bool(os.environ.get(name)) for name in names}
          Path("probe/credential-presence.json").write_text(json.dumps(present, indent=2, sort_keys=True) + "\n")
          print("credential-presence=" + json.dumps(present, sort_keys=True))

          base = "https://c22dur260729jms1.blob.core.windows.net/sat-runs"
          query = urllib.parse.urlencode({
              "restype": "container", "comp": "list", "include": "metadata", "maxresults": "1"
          })
          request = urllib.request.Request(base + "?" + query, headers={"x-ms-version": "2023-11-03"})
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  body = response.read()
                  result = {"http": response.status, "body": body.decode("utf-8", "replace")}
          except urllib.error.HTTPError as exc:
              result = {"http": exc.code, "body": exc.read().decode("utf-8", "replace")}
          except Exception as exc:
              result = {"http": None, "body": repr(exc)}
          Path("probe/anonymous-status.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(f"anonymous-http={result['http']}")
          PY

          : > probe/auth-attempts.txt
          success=0

          try_list() {
            local label="$1"; shift
            echo "attempt=$label" >> probe/auth-attempts.txt
            if "$@" > probe/inventory-auth.json 2> probe/az-error.txt; then
              local count
              count=$(python3 - <<'PY'
          import json
          with open('probe/inventory-auth.json') as f:
              value=json.load(f)
          print(len(value) if isinstance(value,list) else -1)
          PY
              )
              echo "success=$label count=$count" | tee -a probe/auth-attempts.txt
              success=1
              return 0
            fi
            local rc=$?
            echo "failed=$label rc=$rc" >> probe/auth-attempts.txt
            return 1
          }

          for pair in \
            "AZURE_STORAGE_CONNECTION_STRING:${AZURE_STORAGE_CONNECTION_STRING:-}" \
            "STORAGE_CONNECTION_STRING:${STORAGE_CONNECTION_STRING:-}"; do
            label=${pair%%:*}; value=${pair#*:}
            if [[ -n "$value" ]]; then
              try_list "$label" az storage blob list \
                --container-name sat-runs --connection-string "$value" \
                --include m --num-results '*' --output json && break
            fi
          done

          if [[ $success -eq 0 ]]; then
            for pair in \
              "AZURE_STORAGE_ACCOUNT_KEY:${AZURE_STORAGE_ACCOUNT_KEY:-}" \
              "AZURE_STORAGE_KEY:${AZURE_STORAGE_KEY:-}" \
              "STORAGE_ACCOUNT_KEY:${STORAGE_ACCOUNT_KEY:-}"; do
              label=${pair%%:*}; value=${pair#*:}
              if [[ -n "$value" ]]; then
                try_list "$label" az storage blob list \
                  --account-name c22dur260729jms1 --container-name sat-runs \
                  --account-key "$value" --include m --num-results '*' --output json && break
              fi
            done
          fi

          if [[ $success -eq 0 ]]; then
            for pair in \
              "AZURE_STORAGE_SAS_TOKEN:${AZURE_STORAGE_SAS_TOKEN:-}" \
              "AZURE_SAS_TOKEN:${AZURE_SAS_TOKEN:-}" \
              "SAT_RUNS_SAS:${SAT_RUNS_SAS:-}" \
              "SAT_RUNS_SAS_TOKEN:${SAT_RUNS_SAS_TOKEN:-}"; do
              label=${pair%%:*}; value=${pair#*:}; value=${value#\?}
              if [[ -n "$value" ]]; then
                try_list "$label" az storage blob list \
                  --account-name c22dur260729jms1 --container-name sat-runs \
                  --sas-token "$value" --include m --num-results '*' --output json && break
              fi
            done
          fi

          if [[ $success -eq 0 && -n "${AZURE_CREDENTIALS:-}" ]]; then
            readarray -t sp < <(python3 - <<'PY'
          import json, os
          value=json.loads(os.environ['AZURE_CREDENTIALS'])
          for key in ('clientId','clientSecret','tenantId','subscriptionId'):
              print(value.get(key,''))
          PY
            )
            if [[ -n "${sp[0]}" && -n "${sp[1]}" && -n "${sp[2]}" ]]; then
              if az login --service-principal --username "${sp[0]}" --password "${sp[1]}" --tenant "${sp[2]}" >/dev/null 2>probe/az-login-error.txt; then
                [[ -z "${sp[3]}" ]] || az account set --subscription "${sp[3]}"
                try_list "AZURE_CREDENTIALS" az storage blob list \
                  --account-name c22dur260729jms1 --container-name sat-runs \
                  --auth-mode login --include m --num-results '*' --output json || true
              else
                echo "failed=AZURE_CREDENTIALS-login" >> probe/auth-attempts.txt
              fi
            fi
          fi

          if [[ $success -eq 0 ]]; then
            echo "no-usable-attached-credential" | tee -a probe/auth-attempts.txt
          fi

          cat probe/auth-attempts.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7thin-receipt-inventory
          path: probe/
          if-no-files-found: error
          retention-days: 7

name: Temporary 7-thin receipt inventory probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe public Azure receipt inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          base = "https://c22dur260729jms1.blob.core.windows.net/sat-runs"
          marker = ""
          rows = []
          pages = []
          status = {"base": base, "pages": 0, "http": None, "error": None}

          for page_no in range(1, 20):
              query = {
                  "restype": "container",
                  "comp": "list",
                  "include": "metadata",
                  "maxresults": "5000",
              }
              if marker:
                  query["marker"] = marker
              url = base + "?" + urllib.parse.urlencode(query)
              request = urllib.request.Request(url, headers={"x-ms-version": "2023-11-03"})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read()
                      status["http"] = response.status
                      pages.append(body.decode("utf-8", "replace"))
              except urllib.error.HTTPError as exc:
                  body = exc.read()
                  status["http"] = exc.code
                  status["error"] = body.decode("utf-8", "replace")
                  Path("probe/error-body.txt").write_bytes(body)
                  break
              except Exception as exc:
                  status["error"] = repr(exc)
                  break

              root = ET.fromstring(body)
              for blob in root.findall("./Blobs/Blob"):
                  name = blob.findtext("Name") or ""
                  props = blob.find("Properties")
                  metadata = blob.find("Metadata")
                  row = {
                      "name": name,
                      "length": int(props.findtext("Content-Length") or 0) if props is not None else None,
                      "etag": props.findtext("Etag") if props is not None else None,
                      "last_modified": props.findtext("Last-Modified") if props is not None else None,
                      "metadata": ({child.tag: child.text for child in metadata} if metadata is not None else {}),
                  }
                  rows.append(row)
              marker = root.findtext("NextMarker") or ""
              status["pages"] = page_no
              if not marker:
                  break

          Path("probe/status.json").write_text(json.dumps(status, indent=2, sort_keys=True) + "\n")
          Path("probe/inventory.jsonl").write_text("".join(json.dumps(row, sort_keys=True) + "\n" for row in rows))
          Path("probe/raw-pages.xml").write_text("\n<!-- PAGE -->\n".join(pages))

          print(json.dumps(status, indent=2, sort_keys=True))
          print(f"blob_count={len(rows)}")
          for row in rows[:200]:
              print(f"{row['length']:>12}  {row['name']}")
          if len(rows) > 200:
              print(f"... {len(rows)-200} additional blobs recorded in artifact")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7thin-receipt-inventory
          path: probe/
          if-no-files-found: error
          retention-days: 7

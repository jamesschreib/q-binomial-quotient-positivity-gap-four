name: Class22 Kissat bootstrap

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Build Kissat 4.0.4
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch rel-4.0.4 https://github.com/arminbiere/kissat.git
          cd kissat
          ./configure
          make -j"$(nproc)"
          ./build/kissat --version
          mkdir -p ../artifact
          cp ./build/kissat ../artifact/kissat
          sha256sum ../artifact/kissat > ../artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: kissat-linux-x86_64
          path: artifact/
          if-no-files-found: error
          retention-days: 7
